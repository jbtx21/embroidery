name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Kap. 13.2: die Kreuzpruefung vergleicht unsere DST byte-identisch gegen
      # pyembroidery. Fehlt das Paket, ueberspringt die Suite den Block — hier
      # darf sie das nicht.
      - run: pip install pyembroidery

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
